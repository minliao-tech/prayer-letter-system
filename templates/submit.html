{% extends "base.html" %}

{% block title %}填寫代禱信{% endblock %}

{% block content %}

<div class="pagehead">
  <div>
    <div class="eyebrow">SUBMISSION</div>
    <h1>填寫本週代禱事項</h1>
  </div>
</div>

<form method="post" class="panel" id="prayer-form">
  <input type="hidden" name="week_date" value="{{ week_date }}">

  <div class="grid2">
    <label>
      輪值組別
      <select name="group_code" id="group" required>
        {% for g in groups %}
        <option
          value="{{ g }}"
          {% if g == group_code %}selected{% endif %}
        >
          {{ g }}組
        </option>
        {% endfor %}
      </select>
    </label>
  </div>

  <div class="grid2">
    <label>
      處級單位
      <select name="parent_unit" id="parent" required></select>
    </label>

    <label>
      填寫單位
      <select name="unit_name" id="unit" required></select>
    </label>
  </div>

  <hr>

  <h2>代禱事項</h2>

  <div id="items">
    <div class="item">
      <span>1</span>
      <textarea
        name="prayer_item"
        rows="4"
        required
        placeholder="請輸入代禱內容，例如:求神保守牧區..."
      ></textarea>
    </div>
  </div>

  <button type="button" class="btn" id="add">
    ＋ 新增一項
  </button>
  <p>如需填寫第二項，請按「＋ 新增一項」。</p>

  <ol class="prayer-notes">
    <li>請直接填寫文字內容不用標註編號</li>
    <li>每單位至多兩項代禱事項，每項內容不超過65字</li>
  </ol>

  <div class="submitbar">
    <button class="btn primary" type="submit">
      送出代禱事項
    </button>
  </div>
</form>

{% endblock %}

{% block scripts %}

<script>
const data = {{ groups | tojson }};

const groupSelect = document.querySelector("#group");
const parentSelect = document.querySelector("#parent");
const unitSelect = document.querySelector("#unit");

function loadParents() {
  const group = groupSelect.value;
  parentSelect.innerHTML = "";

  const parents = Object.keys(data[group] || {});

  parents.forEach(function(parent) {
    const option = document.createElement("option");
    option.value = parent;
    option.textContent = parent;
    parentSelect.appendChild(option);
  });

  loadUnits();
}

function loadUnits() {
  const group = groupSelect.value;
  const parent = parentSelect.value;
  unitSelect.innerHTML = "";

  const units = (data[group] && data[group][parent])
    ? data[group][parent]
    : [];

  // 沒有下層單位時，直接使用上層單位名稱。
  if (units.length === 0) {
    const option = document.createElement("option");
    option.value = parent;
    option.textContent = parent;
    unitSelect.appendChild(option);
    return;
  }

  units.forEach(function(unit) {
    const option = document.createElement("option");
    option.value = unit;
    option.textContent = unit;
    unitSelect.appendChild(option);
  });
}

groupSelect.addEventListener("change", loadParents);
parentSelect.addEventListener("change", loadUnits);

loadParents();

document.querySelector("#add").addEventListener("click", function() {
  const items = document.querySelector("#items");
  const number = items.children.length + 1;
  const box = document.createElement("div");

  box.className = "item";
  box.innerHTML = `
    <span>${number}</span>
    <textarea
      name="prayer_item"
      rows="4"
      required
      placeholder="請輸入代禱內容，例如:求神保守牧區..."
    ></textarea>
  `;

  items.appendChild(box);
});
</script>

{% endblock %}
