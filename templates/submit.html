{% extends "base.html" %}

{% block title %}填寫代禱信{% endblock %}

{% block content %}

<div class="pagehead">
  <div>
    <div class="eyebrow">SUBMISSION</div>
    <h1>填寫本週代禱事項</h1>
  </div>
  <p>不限制項數，按「＋新增」即可繼續填寫。</p>
</div>

<form method="post" class="panel" id="prayer-form">

  <div class="grid2">

    <label>
      批次日期
      <input
        type="date"
        name="week_date"
        value="{{ week_date }}"
        required
      >
    </label>

    <label>
      輪值組別
      <select name="group_code" id="group" required>
        {% for g in groups %}
        <option
          value="{{ g }}"
          {% if g == group_code %}selected{% endif %}
        >
          {{ g }}組
        </option>
        {% endfor %}
      </select>
    </label>

  </div>

  <div class="grid2">

    <label>
      上層單位
      <select
        name="parent_unit"
        id="parent"
        required
      ></select>
    </label>

    <label>
      填寫單位
      <select
        name="unit_name"
        id="unit"
        required
      ></select>
    </label>

  </div>

  <div class="grid2">

    <label>
      填寫人（選填）
      <input
        type="text"
        name="contact_name"
      >
    </label>

    <label>
      Email（選填）
      <input
        type="email"
        name="contact_email"
      >
    </label>

  </div>

  <hr>

  <h2>代禱事項</h2>

  <div id="items">

    <div class="item">
      <span>1</span>
      <textarea
        name="prayer_item"
        rows="4"
        required
        placeholder="請輸入代禱內容..."
      ></textarea>
    </div>

  </div>

  <button
    type="button"
    class="btn"
    id="add"
  >
    ＋ 新增一項
  </button>

  <div class="submitbar">
    <button
      class="btn primary"
      type="submit"
    >
      送出代禱事項
    </button>
  </div>

</form>

{% endblock %}


{% block scripts %}

<script>

const data = {{ groups | tojson }};

const groupSelect =
  document.querySelector("#group");

const parentSelect =
  document.querySelector("#parent");

const unitSelect =
  document.querySelector("#unit");


/* =========================
   產生「上層單位」
   ========================= */

function loadParents() {

  const group =
    groupSelect.value;

  parentSelect.innerHTML = "";

  const parents =
    Object.keys(data[group] || {});

  parents.forEach(function(parent) {

    const option =
      document.createElement("option");

    option.value = parent;
    option.textContent = parent;

    parentSelect.appendChild(option);

  });

  loadUnits();
}


/* =========================
   產生「填寫單位」
   ========================= */

function loadUnits() {

  const group =
    groupSelect.value;

  const parent =
    parentSelect.value;

  unitSelect.innerHTML = "";

  const units =
    (data[group] &&
     data[group][parent])
      ? data[group][parent]
      : [];


  /*
    如果這個上層單位
    沒有下層單位：

    填寫單位直接使用
    上層單位名稱
  */

  if (units.length === 0) {

    const option =
      document.createElement("option");

    option.value = parent;
    option.textContent = parent;

    unitSelect.appendChild(option);

    return;
  }


  /*
    有下層單位：

    顯示所有下層單位
  */

  units.forEach(function(unit) {

    const option =
      document.createElement("option");

    option.value = unit;
    option.textContent = unit;

    unitSelect.appendChild(option);

  });

}


/* =========================
   切換組別
   ========================= */

groupSelect.addEventListener(
  "change",
  loadParents
);


/* =========================
   切換上層單位
   ========================= */

parentSelect.addEventListener(
  "change",
  loadUnits
);


/* =========================
   第一次開啟網頁
   ========================= */

loadParents();


/* =========================
   新增代禱事項
   ========================= */

document
  .querySelector("#add")
  .addEventListener(
    "click",
    function() {

      const items =
        document.querySelector("#items");

      const number =
        items.children.length + 1;

      const box =
        document.createElement("div");

      box.className = "item";

      box.innerHTML = `
        <span>${number}</span>

        <textarea
          name="prayer_item"
          rows="4"
          required
          placeholder="請輸入代禱內容..."
        ></textarea>
      `;

      items.appendChild(box);

    }
  );

</script>

{% endblock %}
